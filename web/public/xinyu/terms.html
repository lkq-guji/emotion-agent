<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="icon" type="image/svg+xml" href="/xinyu/favicon-v2.svg"><title>心屿智伴 · 使用说明与条款</title><style>body{max-width:760px;margin:48px auto;padding:24px;font:16px/1.85 "Microsoft YaHei",sans-serif;color:#34305c;background:#f8f6ff}a{color:#705ba5}h1{font-size:28px}h2{margin-top:32px;font-size:20px}small{color:#716888}nav{display:flex;gap:24px;margin-top:32px}</style></head><body><main><h1>使用说明与条款</h1><p>心屿智伴是一款提供日常对话、情绪记录和个人记忆管理的 AI 陪伴应用。</p><p>AI 回复与情绪分析可能存在错误，你可以更正或删除自己的记录。本应用不提供医疗诊断、治疗或紧急援助服务。</p><p>发送对话时，相关内容会交给你选择的模型提供方处理，并适用其服务规则和计费方式。开启记忆、画像或情绪分析前，请阅读<a href="/xinyu/privacy.html">隐私说明</a>。模型不可用时会显示失败，可重试或检查模型设置。</p><p>应用使用的开源组件、素材来源与许可证见<a href="/xinyu/credits.html">素材与开源许可</a>。如果主动使用云同步等外部服务，同时适用对应服务的<a href="https://account.sionyw.com/terms">使用条款</a>和<a href="https://account.sionyw.com/privacy">隐私政策</a>。</p><nav><a href="/#/settings">返回我的小岛</a><a href="/">回到首页</a></nav></main></body></html>
